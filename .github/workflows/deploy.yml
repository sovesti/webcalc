name: Deploy

on:
  push:
    branches:
      - master
env:
  WEBCALC_HOST: ${{ vars.WEBCALC_HOST }}
jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Bundle project
        run: dx bundle --release --server --out-dir dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webcalc-server
          path: dist/web
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Build project
        run: dx bundle --web --release --out-dir dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webcalc-web
          path: dist
  # win msi
  deploy-desktop:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
            toolchain: stable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus
        run: cargo install dioxus-cli
      - name: Bundle project
        run: dx bundle --release --desktop --package-types "msi" --out-dir dist\bundle
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: webcalc-x86_64-windows.msi
          path: dist\bundle\*.msi
  # linux (for fedora and ubuntu)
  deploy-desktop-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: deb
            distro: ubuntu
            artifact_name: webcalc-x86_64-ubuntu
            artifact_path: dist/bundle/**/*.deb

          - package_type: rpm
            distro: fedora
            artifact_name: webcalc-x86_64-fedora
            artifact_path: dist/bundle/**/*.rpm

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rs/toolchain@v1.0.6
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: linux-bundle-${{ matrix.package_type }}-ubuntu22

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld \
            rpm

      - name: Install Dioxus CLI from source
        shell: bash
        run: |
          rm -f "$HOME/.cargo/bin/dx"
          cargo install dioxus-cli --version 0.7.10 --locked --force
          dx --version

      - name: Bundle ${{ matrix.distro }} installer
        run: >
          dx bundle
          --release
          --desktop
          --package-types "${{ matrix.package_type }}"
          --out-dir dist/bundle

      - name: Upload ${{ matrix.distro }} installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
