name: webcalc

services:
  # server
  app:
    image: ${WEBCALC_IMAGE:-webcalc:local}
    build:
      context: ..
      dockerfile: CD/Dockerfile
    restart: unless-stopped
    environment:
      IP: 0.0.0.0
      PORT: "8080"
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "5",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # postgreSQL
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webcalc}
      POSTGRES_USER: ${POSTGRES_USER:-webcalc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in CD/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # nginx reverse-proxy
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
