[package]
name = "webcalc"
version = "0.1.0"
authors = ["Vasily Fedorov <vasily.fedorov@arsysop.ru>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = { version = "0.1.92", optional = true}
axum = { version = "0.8.9", optional = true}
axum_session = { version = "0.21.0", optional = true}
axum_session_auth = { version = "0.21.0", optional = true}
axum_session_sqlx = { version = "0.11.0", optional = true}
config = { version = "0.15.25", optional = true }
dioxus = { version = "0.7.1", features = ["fullstack"] }
http = { version = "1.5.0", optional = true }
password-auth = { version = "1.0.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["macros", "postgres"], optional = true }
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"], optional = true }
toml = { version = "1.1.5", optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.1", optional = true }

[dev-dependencies]
axum-test = "21.1.0"

[features]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = [
    "dioxus/server",
    "async-trait",
    "axum",
    "axum_session",
    "axum_session_auth",
    "axum_session_sqlx",
    "config",
    "http",
    "password-auth",
    "sqlx",
    "tokio",
    "toml",
    "tower",
    "tower-http"
]
test = ["server"]
